<!DOCTYPE html>
<html>
<head>
    <title>Travel Agency Payment Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: transparent;
        }
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100vw;
            min-height: 100vh;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
        }
        .payment-form {
            background: rgba(255, 255, 255, 0.9);
            padding: 24px;
            max-width: 400px;
            margin: 60px auto;
            border-radius: 8px;
            box-shadow: 0 0 14px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }
        label { 
            display: block;
            margin-top: 14px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin-top: 5px;
        }
        .submit-btn {
            background: #0288d1;
            color: white;
            font-size: 1rem;
            padding: 10px 0;
            border: none;
            border-radius: 4px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
        <source src="paymentbg.html.jpg" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Payment Form -->
    <div class="payment-form">
        <h2>Payment Form</h2>
        <form>
            <label for="bookingid">Booking Reference/ID:</label>
            <input type="text" id="bookingid" name="bookingid" placeholder="Enter your booking ID" required>
            
            <label for="name">Name on Card:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="cardnumber">Card Number:</label>
            <input type="text" id="cardnumber" name="cardnumber" maxlength="19" placeholder="xxxx xxxx xxxx xxxx" required>
            
            <label for="expiry">Expiry Date:</label>
            <input type="text" id="expiry" name="expiry" maxlength="5" placeholder="MM/YY" required>
            
            <label for="cvv">CVV:</label>
            <input type="password" id="cvv" name="cvv" maxlength="4" placeholder="3 or 4 digits" required>
            
            <label for="amount">Amount to Pay (INR):</label>
            <input type="number" id="amount" name="amount" placeholder="e.g. 45000" min="1" required>
            
            <label for="paymentmethod">Payment Method:</label>
            <select id="paymentmethod" name="paymentmethod" required>
                <option value="credit">Credit Card</option>
                <option value="debit">Debit Card</option>
                <option value="upi">UPI</option>
                <option value="netbanking">Net Banking</option>
            </select>

            <button type="submit" class="submit-btn">Pay Now</button>
        </form>
    </div>

</body>
</html>
